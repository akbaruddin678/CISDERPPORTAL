services:
  backend:
    build: ./backend
    container_name: cisd_backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - PORT=5000
    volumes:
      - backend_uploads:/usr/src/app/uploads
    expose:
      - "5000"

  frontend:
    build: ./frontend
    container_name: cisd_frontend
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    container_name: cisd_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    # Reload nginx every 6h so renewed certificates are picked up
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done &
      nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot
    container_name: cisd_certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Try to renew twice a day (only renews when close to expiry)
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

volumes:
  backend_uploads:
