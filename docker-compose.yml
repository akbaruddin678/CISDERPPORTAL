services:
  backend:
    build: ./backend
    container_name: cisd_backend
    restart: unless-stopped
    network_mode: bridge
    env_file: ./backend/.env
    environment:
      - PORT=5000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_uploads:/usr/src/app/uploads
    ports:
      - "127.0.0.1:5022:5000"

  frontend:
    build: ./frontend
    container_name: cisd_frontend
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "127.0.0.1:3022:80"

volumes:
  backend_uploads:
