# Host nginx: /etc/nginx/sites-available/cisd.cisdportal.online
# Certificates are added by: certbot --nginx -d cisd.cisdportal.online -d apicisd.cisdportal.online

# Frontend
server {
    listen 80;
    server_name cisd.cisdportal.online;

    location / {
        proxy_pass http://127.0.0.1:3022;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Backend API
server {
    listen 80;
    server_name apicisd.cisdportal.online;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:5022;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
